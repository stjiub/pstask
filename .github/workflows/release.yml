name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        shell: pwsh
        run: |
          $version = (Import-PowerShellDataFile PSTask/PSTask.psd1).ModuleVersion
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match manifest version $version"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          function Install-Retry {
            param([string]$Name, [hashtable]$Params = @{})
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name @Params -Force -Scope CurrentUser -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
          }
          Install-Retry Pester @{ MinimumVersion = '5.5'; SkipPublisherCheck = $true }
          Install-Retry PSScriptAnalyzer

      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./build.ps1 -Task Publish -NuGetApiKey $env:PSGALLERY_API_KEY

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $header = "^## $([regex]::Escape($version))(\s|$)"
          $start = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match $header } | Select-Object -First 1
          if ($null -eq $start) { throw "No '## $version' section in CHANGELOG.md" }

          $body = foreach ($line in $lines[($start + 1)..($lines.Count - 1)]) {
              if ($line -match '^## ') { break }
              $line
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "The '## $version' section in CHANGELOG.md is empty" }
          Set-Content -Path release-notes.md -Value $text

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
