name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          function Install-Retry {
            param([string]$Name, [hashtable]$Params = @{})
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name @Params -Force -Scope CurrentUser -ErrorAction Stop; return }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds (5 * $i) }
            }
          }
          Install-Retry Pester @{ MinimumVersion = '5.5'; SkipPublisherCheck = $true }
          Install-Retry PSScriptAnalyzer
          if ($PSVersionTable.PSEdition -eq 'Desktop') { Install-Retry ThreadJob @{ AllowClobber = $true } }

      - name: Analyze and test
        run: ./build.ps1 -Task Test -Coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: |
            TestResults/
            coverage.xml
